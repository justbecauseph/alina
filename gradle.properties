org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric, the versions the Lampas pack runs (lampas-pipeline pack.toml and pack/mods/fabric-api.toml). Architectury
# 21.1.12 needs loader 0.19.5 and Fabric API 0.160.0 at least, and Farmer's Delight needs loader 0.19.5.
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.17-SNAPSHOT
fabric_api_version=0.161.0+26.2

# haruhi from the JustBecause Maven repository. A ../haruhi checkout replaces it whatever this says (settings.gradle).
haruhi_version=0.1.0

# GeckoLib 5.5.5 for 26.2, the version the Lampas pack runs and haruhi uses. Dev client only (build.gradle).
geckolib_version=7gaQHok7

# Storage: bundled with jar-in-jar.
postgresql_version=42.7.7
hikaricp_version=7.1.0

# Tests.
junit_version=5.13.4
testcontainers_version=2.0.3
json_schema_validator_version=3.0.9

mod_version=0.1.0
maven_group=town.lampas
archives_base_name=alina
