pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'alina'

// Alina depends on town.lampas:haruhi from the JustBecause Maven repository (build.gradle). When a haruhi checkout sits
// beside this one, Gradle builds that instead, so a haruhi change can be tried before it is published. Pass
// -Palina.publishedHaruhi=true to build against the published jar even with a checkout present.
def localHaruhi = file('../haruhi')
if (localHaruhi.isDirectory() && !providers.gradleProperty('alina.publishedHaruhi').map { it.toBoolean() }.getOrElse(false)) {
	includeBuild(localHaruhi)
}
